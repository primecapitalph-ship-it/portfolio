<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reymund David | Civil Engineering Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#101D2D;--ch:#202A35;--bg:#fff;--gray:#F1F3F6;--tx:#202124;--mu:#5d6773;--or:#E58A35;--ln:#dfe3e8;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1420;--gray:#101D2D;--tx:#e8ebef;--mu:#9aa5b1;--ln:#26364a;--card:#142236}}
html{scroll-behavior:smooth;scroll-padding-top:70px}
*{box-sizing:border-box}body{margin:0;font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65}
img{max-width:100%;display:block}a{color:inherit}
.w{max-width:1100px;margin:0 auto;padding:0 22px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--navy);color:#fff}
nav .w{display:flex;align-items:center;justify-content:space-between;height:58px;gap:12px}
nav b{letter-spacing:.08em;font-size:.9rem}nav b i{color:var(--or);font-style:normal}
nav .l{display:flex;gap:18px;overflow-x:auto;font-size:.82rem}nav .l a{text-decoration:none;opacity:.85;white-space:nowrap;cursor:pointer}nav .l a:hover{opacity:1;color:var(--or)}
.hero{background:linear-gradient(135deg,var(--navy),var(--ch));color:#fff;padding:96px 0 84px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 79px,rgba(255,255,255,.04) 79px 80px),repeating-linear-gradient(0deg,transparent 0 79px,rgba(255,255,255,.04) 79px 80px)}
.hero .w{position:relative;z-index:1}.hero small{color:var(--or);letter-spacing:.18em;font-weight:800}
.hero h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.1;margin:.3em 0}.hero p{max-width:620px;opacity:.85}
.btn{display:inline-block;background:var(--or);color:#101D2D;padding:11px 22px;border-radius:6px;font-weight:800;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:800;margin:4px 8px 4px 0}
.btn.o{background:transparent;color:inherit;border:1.5px solid currentColor}.btn.s{padding:5px 11px;font-size:.78rem}
section{padding:72px 0}section.g{background:var(--gray)}
h2{font-size:1.7rem;margin:0 0 6px}h2:after{content:"";display:block;width:46px;height:3px;background:var(--or);margin-top:8px}
.eb{color:var(--or);font-weight:800;letter-spacing:.15em;font-size:.75rem}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:28px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s;display:block}
.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(16,29,45,.18)}
.card img{width:100%;aspect-ratio:16/10;object-fit:cover}.card div{padding:16px 18px 20px}
.card h3{margin:4px 0 6px;font-size:1rem;line-height:1.3}.card p{margin:0;font-size:.85rem;color:var(--mu)}
.feat{grid-column:1/-1;display:grid;grid-template-columns:1.2fr 1fr}.feat img{height:100%;aspect-ratio:auto;min-height:260px}.feat div{align-self:center;padding:28px}
.feat.f .tag,.card.f .tag{background:var(--or);color:#101D2D}
.tag{display:inline-block;background:var(--navy);color:#fff;font-size:.68rem;font-weight:800;padding:2px 9px;border-radius:20px;letter-spacing:.04em}
@media(max-width:720px){.feat{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.chips span{background:var(--card);border:1px solid var(--ln);border-left:3px solid var(--or);padding:9px 16px;border-radius:6px;font-weight:600;font-size:.9rem}
.two{display:grid;gap:34px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
ul.chk{padding-left:0;list-style:none}ul.chk li{padding-left:22px;position:relative;margin:7px 0}ul.chk li:before{content:"";position:absolute;left:0;top:.7em;width:9px;height:9px;background:var(--or);border-radius:2px}
footer{background:var(--navy);color:#cfd6de;padding:40px 0;text-align:center;font-size:.85rem}
.crumb{padding:26px 0 0;font-size:.85rem}.crumb a{cursor:pointer;color:var(--or);font-weight:800}
.ph{background:var(--navy);color:#fff;padding:50px 0 44px}.ph h1{font-size:clamp(1.4rem,3.6vw,2.2rem);line-height:1.25;margin:.3em 0}
.blk{margin:34px 0}.blk h2{font-size:1.2rem}.blk p{white-space:pre-line;margin:.6em 0}.ph-t{color:var(--mu);font-style:italic}
.gal{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:18px}
.gal figure{margin:0;background:var(--card);border:1px solid var(--ln);border-radius:8px;overflow:hidden}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;cursor:zoom-in}
.gal figcaption{padding:10px 14px;font-size:.85rem}.gal figcaption b{display:block}.gal figcaption span{color:var(--mu)}
.lb{position:fixed;inset:0;background:rgba(5,10,18,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;cursor:zoom-out}.lb img{max-height:78vh;object-fit:contain}
.fade{animation:f .5s ease both}@keyframes f{from{opacity:0;transform:translateY(12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
input,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:6px;background:var(--card);color:var(--tx);margin:4px 0}textarea{min-height:90px}
.ed{background:rgba(229,138,53,.1);border:1px dashed var(--or);padding:10px;border-radius:8px;margin:8px 0}.ed small{font-weight:800;color:var(--or)}
.bar{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;gap:8px}
</style></head><body>
<nav><div class="w"><b>REYMUND<i>.</i>DAVID</b><div class="l"><a data-s="about">About</a><a data-s="projects">Projects</a><a data-s="skills">Skills</a><a data-s="education">Education</a><a data-s="experience">Experience</a><a data-s="contact">Contact</a></div></div></nav>
<div id="app"></div><div class="bar" id="bar"></div>
<script>
const ph=(t,c)=>'data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect width="800" height="500" fill="#${c||'202A35'}"/><g stroke="#E58A35" stroke-width="2" fill="none" opacity=".6"><path d="M120 400V180l140-60 140 60v220M260 120v280M120 260h280M120 340h280M470 400V240l100-40 100 40v160M470 320h200"/></g><text x="400" y="460" fill="#fff" font-family="sans-serif" font-size="22" text-anchor="middle" opacity=".7">${t}</text></svg>`);
const P="[Add details here]";
const mk=(id,n,title,cat,sw,desc,show,fc)=>({id,n,title,cat,sw,fc,thumb:"",desc,show,
 obj:"[Add project objectives here]",spec:"[Add specifications here, one per line]",method:"[Describe the structural design methodology or drafting process here]",
 models:"[Describe the engineering drawings and structural models here]",ana:"[Add analysis and design documentation notes here]",out:"[Add project outcomes and key takeaways here]",
 gal:[1,2,3].map(i=>({src:"",cap:"Image "+i+" caption",d:"[Add image description here]"}))});
const DEF={projects:[
mk("northwin","Project 01","NORTHWIN TOWER: A DESIGN OF A 10-STOREY MIXED-USE BUILDING WITH POLYCARBONATE FAÇADE IN NORTHWIN GLOBAL CITY, MARILAO, BULACAN","Final Capstone Project | Structural Analysis and Design","ETABS and other applicable engineering software","Northwin Tower is our final capstone project involving the structural design and assessment of a proposed 10-storey mixed-use building located in Northwin Global City, Marilao, Bulacan. The study focused on evaluating different lateral load-resisting systems to determine an appropriate structural solution for a high-seismic region, following the provisions of NSCP 2015.\n\nThe project examined three structural systems: Dual System (Reinforced Concrete Special Moment-Resisting Frame with Shear Walls), Core Wall System, and Steel Cross-Bracing System. The study recommended the Core Wall System based on its structural performance and suitability for the proposed building.",["Project background and objectives","Architectural and structural building overview","ETABS 3D structural model","Structural system alternatives","Seismic and lateral load analysis","Structural design and assessment","Comparison of structural systems","Final recommended structural system","Structural analysis screenshots and engineering documentation"],1),
mk("autocad","Project 02","TECHNICAL DRAWING PROJECT – AUTOCAD","Engineering Drafting | Technical Drawing","AutoCAD","A technical drafting project demonstrating proficiency in AutoCAD through the preparation of engineering drawings. The project highlights the application of drafting standards, drawing accuracy, proper dimensioning, and the presentation of technical details.",["Project overview and objectives","Technical drawings","Floor plans, elevations, and sections, if applicable","Engineering details and dimensions","Drafting outputs","Multiple drawing screenshots and image galleries"],0),
],
about:"I am a 2026 Civil Engineering graduate from the Technological Institute of the Philippines – Manila, with a strong interest in structural engineering, analysis, and design. I have hands-on experience using engineering software such as ETABS, SAFE, and AutoCAD through academic projects and practical applications. I am passionate about developing my technical skills, applying engineering principles to real-world challenges, and continuously learning to grow as a future civil engineer.",
skills:["ETABS","SAFE","AutoCAD","Structural Analysis and Design","Reinforced Concrete Design","Structural Steel Design","Engineering Drafting","Technical Documentation"],
exp:["Site inspection and monitoring","Construction progress monitoring","Coordination with engineers and project personnel","Consultant site visits","Actual construction activities","Engineering documentation and reporting"],
email:"reymunddavid@gmail.com",phone:"+639068854920",li:"www.linkedin.com/in/reymund-david-ab4530216"};
let D=JSON.parse(JSON.stringify(DEF)),canEdit=false,editing=false,dbDoc=null,assets=null,dirty=false;
const $=(s)=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lines=s=>String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const phold=v=>/^\[.*\]$/.test((v||"").trim());
const thumb=p=>p.thumb||ph(p.n,["202A35","1b3350","27405f","2d3640"][D.projects.indexOf(p)%4]);
const imgs=p=>p.gal.map((g,i)=>({...g,src:g.src||ph("Image placeholder "+(i+1),"27405f")}));
function home(){const A=D.projects;
 return `<div class="fade"><header class="hero"><div class="w"><small>CIVIL ENGINEER</small><h1>Reymund David</h1><p>Structural analysis and design with ETABS and SAFE, reinforced concrete and steel design, and technical drafting in AutoCAD.</p><a class="btn" data-s="projects">View projects</a><a class="btn o" data-s="contact">Get in touch</a></div></header>
<section id="about"><div class="w two"><div><span class="eb">01 · ABOUT</span><h2>About Me</h2>${ed("about","area",D.about)}</div><div><span class="eb">TECHNOLOGICAL INSTITUTE OF THE PHILIPPINES</span><p style="font-size:2.6rem;font-weight:800;color:var(--or);margin:0">2026</p><p>Civil Engineering graduate focused on structural engineering, analysis, and design.</p></div></div></section>
<section id="projects" class="g"><div class="w"><span class="eb">02 · FEATURED ENGINEERING PROJECTS</span><h2>Projects</h2><div class="grid">${A.map((p,i)=>`<a class="card ${p.fc?'f':''}" data-p="${p.id}"><img src="${esc(thumb(p))}" alt=""><div><span class="tag">${esc(p.n)}${p.fc?' · STRUCTURAL DESIGN':''}</span><h3>${esc(p.title)}</h3><p>${esc(p.cat)} · ${esc(p.sw)}</p>${editing?`<p style="margin-top:8px"><button class="btn s" data-mv="${i}" data-d="-1">↑</button><button class="btn s" data-mv="${i}" data-d="1">↓</button><button class="btn s o" data-del="${i}">Delete</button></p>`:''}</div></a>`).join("")}</div>${editing?'<p><button class="btn" id="addp">+ Add project</button></p>':''}</div></section>
<section id="skills"><div class="w"><span class="eb">03 · TECHNICAL SKILLS</span><h2>Skills</h2>${editing?ed("skills","lines",D.skills.join("\n")):`<div class="chips">${D.skills.map(s=>`<span>${esc(s)}</span>`).join("")}</div>`}</div></section>
<section id="education" class="g"><div class="w"><span class="eb">04 · EDUCATION</span><h2>Education</h2><h3 style="margin-bottom:0">Bachelor of Science in Civil Engineering</h3><p style="margin:0">Technological Institute of the Philippines – Manila</p><p style="color:var(--or);font-weight:800">Graduation Year: 2026</p></div></section>
<section id="experience"><div class="w"><span class="eb">05 · PROFESSIONAL EXPERIENCE</span><h2>On-the-Job Training</h2><h3 style="margin-bottom:0">DPWH – FCMC – UPMO</h3><p style="color:var(--mu)">Involvement and exposure to:</p>${editing?ed("exp","lines",D.exp.join("\n")):`<ul class="chk">${D.exp.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`}</div></section>
<section id="contact" class="g"><div class="w"><span class="eb">06 · CONTACT</span><h2>Let’s connect</h2><p>Reymund David</p><a class="btn" href="mailto:${esc(D.email)}">${esc(D.email)}</a><a class="btn o" href="tel:${esc(D.phone)}">${esc(D.phone)}</a><a class="btn o" href="https://${esc(D.li)}" target="_blank" rel="noopener">LinkedIn</a></div></section>
<footer>© 2026 Reymund David · Civil Engineering Portfolio</footer></div>`}
const F=[["title","Project title","text"],["cat","Category","text"],["sw","Software and tools used","text"],["desc","1 · Project overview","area"],["obj","2 · Project objectives","area"],["spec","3 · Project specifications (one per line)","lines"],["method","4 · Design methodology / drafting process","area"],["models","5 · Engineering drawings and structural models","area"],["ana","6 · Analysis and design documentation","area"],["out","8 · Project outcomes and key takeaways","area"]];
function ed(k,t,v,id){if(!editing)return t=="area"?`<p style="white-space:pre-line">${esc(v)}</p>`:esc(v);
 return `<div class="ed">${t=="text"?`<input data-k="${k}" value="${esc(v)}">`:`<textarea data-k="${k}">${esc(v)}</textarea>`}</div>`}
const view=(p,k,t)=>{const v=p[k];return t=="lines"?`<ul class="chk">${lines(v).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:`<p class="${phold(v)?'ph-t':''}">${esc(v)}</p>`};
function proj(p){const sec=(t,b)=>`<div class="blk"><h2>${t}</h2>${b}</div>`;
 const f=k=>F.find(x=>x[0]==k);
 const field=(k)=>editing?`<div class="ed"><small>${f(k)[1]}</small>${f(k)[2]=="text"?`<input data-pk="${k}" value="${esc(p[k])}">`:`<textarea data-pk="${k}">${esc(p[k])}</textarea>`}</div>`:view(p,k,f(k)[2]);
 const g=imgs(p);
 return `<div class="fade"><div class="ph"><div class="w"><span class="tag" style="background:var(--or);color:#101D2D">${esc(p.n)}</span>${editing?field("title")+field("cat"):`<h1>${esc(p.title)}</h1><p style="color:var(--or);font-weight:800;margin:0">${esc(p.cat)}</p>`}</div></div>
<div class="w"><div class="crumb"><a data-s="projects">← All projects</a></div>
${editing?`<div class="ed"><small>THUMBNAIL</small><input type="file" accept="image/*" id="thf"> <button class="btn s o" id="thc">Reset to placeholder</button></div>`:''}
${sec("Project Overview",field("desc"))}${sec("Project Objectives",field("obj"))}
${sec("Software and Tools Used",editing?field("sw"):`<div class="chips" style="margin-top:6px"><span>${esc(p.sw)}</span></div>`)}
${sec(/AutoCAD/.test(p.sw)?"Drafting Process":"Structural Design Methodology",field("method"))}


${sec("Project Image Gallery",`<div class="gal">${g.map((x,i)=>`<figure><img src="${esc(x.src)}" alt="${esc(x.cap)}" data-lb="${i}">${editing?`<div class="ed"><input data-gc="${i}" value="${esc(p.gal[i].cap)}" placeholder="Caption"><textarea data-gd="${i}" style="min-height:60px">${esc(p.gal[i].d)}</textarea><input type="file" accept="image/*" data-gf="${i}"><button class="btn s" data-gm="${i}" data-d="-1">←</button><button class="btn s" data-gm="${i}" data-d="1">→</button><button class="btn s o" data-gx="${i}">Delete</button></div>`:`<figcaption><b>${esc(x.cap)}</b><span>${esc(x.d)}</span></figcaption>`}</figure>`).join("")}</div>${editing?'<p><button class="btn" id="addg">+ Add image slot</button> <label class="btn o">Upload several<input type="file" multiple accept="image/*" id="multi" hidden></label></p>':''}`)}
</div><footer>© 2026 Reymund David</footer></div>`}
function render(keep){const h=location.hash.slice(1),p=D.projects.find(x=>"p-"+x.id==h);const y=scrollY;
 $("#app").innerHTML=p?proj(p):home();if(!p&&h&&!keep){setTimeout(()=>$("#"+h)?.scrollIntoView(),0)}else scrollTo(0,keep?y:0);bar();bind(p)}
function bar(){$("#bar").innerHTML=canEdit?(editing?`<button class="btn" id="sv">Save changes</button><button class="btn o" style="background:var(--navy);color:#fff" id="ex">Exit edit</button>`:`<button class="btn" id="en">Edit site</button>`):""}
async function save(){try{await dbDoc.set({json:JSON.stringify(D)});dirty=false;$("#sv").textContent="Saved ✓"}catch(e){$("#sv").textContent="Save failed"}}
async function up(file){if(!assets||!file)return"";try{const b=await down(file);return(await assets.upload(b)).url}catch(e){alert("Upload failed");return""}}
function down(f){return new Promise(r=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.85)};i.src=URL.createObjectURL(f)})}
function bind(p){
 document.querySelectorAll("[data-s]").forEach(a=>a.onclick=()=>{if(location.hash.startsWith("#p-")){history.pushState(null,"","#"+a.dataset.s);render()}else $("#"+a.dataset.s)?.scrollIntoView()});
 document.querySelectorAll("[data-p]").forEach(a=>a.onclick=e=>{if(e.target.closest("button"))return;location.hash="p-"+a.dataset.p});
 $("#en")&&($("#en").onclick=()=>{editing=true;render(1)});$("#ex")&&($("#ex").onclick=()=>{editing=false;render(1)});$("#sv")&&($("#sv").onclick=save);
 document.querySelectorAll("[data-k]").forEach(i=>i.oninput=()=>{const k=i.dataset.k;D[k]=["skills","exp"].includes(k)?lines(i.value):i.value});
 document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.mv,j=i+ +b.dataset.d;if(j<0||j>=D.projects.length)return;[D.projects[i],D.projects[j]]=[D.projects[j],D.projects[i]];D.projects.forEach((x,k)=>x.n="Project 0"+(k+1));render(1)});
 document.querySelectorAll("[data-del]").forEach(b=>b.onclick=e=>{e.stopPropagation();if(confirm("Delete this project?")){D.projects.splice(+b.dataset.del,1);D.projects.forEach((x,k)=>x.n="Project 0"+(k+1));render(1)}});
 $("#addp")&&($("#addp").onclick=()=>{const n=D.projects.length+1;D.projects.push(mk("p"+Date.now(),"Project 0"+n,"NEW PROJECT TITLE","Category","Software","[Add project description here]",["[Add showcase item]"],0));render(1)});
 document.querySelectorAll(".card img,.gal img").forEach(i=>{if(i.dataset.lb!=null)i.onclick=()=>lb(i)});
 if(!p)return;
 document.querySelectorAll("[data-pk]").forEach(i=>i.oninput=()=>{p[i.dataset.pk]=i.dataset.pk=="show"?lines(i.value):i.value});
 document.querySelectorAll("[data-gc]").forEach(i=>i.oninput=()=>p.gal[+i.dataset.gc].cap=i.value);
 document.querySelectorAll("[data-gd]").forEach(i=>i.oninput=()=>p.gal[+i.dataset.gd].d=i.value);
 document.querySelectorAll("[data-gf]").forEach(i=>i.onchange=async()=>{const u=await up(i.files[0]);if(u){p.gal[+i.dataset.gf].src=u;render(1)}});
 document.querySelectorAll("[data-gm]").forEach(b=>b.onclick=()=>{const i=+b.dataset.gm,j=i+ +b.dataset.d;if(j<0||j>=p.gal.length)return;[p.gal[i],p.gal[j]]=[p.gal[j],p.gal[i]];render(1)});
 document.querySelectorAll("[data-gx]").forEach(b=>b.onclick=()=>{p.gal.splice(+b.dataset.gx,1);render(1)});
 $("#addg")&&($("#addg").onclick=()=>{p.gal.push({src:"",cap:"New caption",d:"[Add image description here]"});render(1)});
 $("#multi")&&($("#multi").onchange=async e=>{for(const f of e.target.files){const u=await up(f);if(u)p.gal.push({src:u,cap:f.name.replace(/\.[^.]+$/,""),d:"[Add image description here]"})}render(1)});
 $("#thf")&&($("#thf").onchange=async e=>{const u=await up(e.target.files[0]);if(u){p.thumb=u;alert("Thumbnail replaced. Remember to save.")}});
 $("#thc")&&($("#thc").onclick=()=>{p.thumb="";alert("Thumbnail reset.")})}
function lb(i){const g=document.createElement("div");g.className="lb";g.innerHTML=`<img src="${i.src}" alt=""><p>${esc(i.alt)}</p>`;g.onclick=()=>g.remove();document.body.appendChild(g)}
addEventListener("hashchange",()=>render());
render();
(async()=>{try{const u=await claude.use("user");canEdit=u?await u.canEdit():false;
 const db=await claude.use("db");assets=await claude.use("assets");
 if(db){dbDoc=db.doc("site/content");const s=await dbDoc.get();if(s.exists&&s.data().json){D=JSON.parse(s.data().json);D.projects=D.projects.filter(x=>x.id!="wave"&&x.id!="bonifacio");if(!D.projects.some(x=>x.id=="autocad"))D.projects.push(DEF.projects.find(x=>x.id=="autocad"));D.projects.forEach((x,k)=>x.n="Project 0"+(k+1));render(1)}}
 if(!(db&&assets))canEdit=false;bar();bind(D.projects.find(x=>"p-"+x.id==location.hash.slice(1)))}catch(e){}})();
</script></body></html>
